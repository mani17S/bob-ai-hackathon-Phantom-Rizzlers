name: Frontend CI

on:
  push:
    paths: ["src/frontend/**", ".github/workflows/frontend.yml"]
  pull_request:
    paths: ["src/frontend/**", ".github/workflows/frontend.yml"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
